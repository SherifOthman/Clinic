name: CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  backend-tests:
    name: Backend Tests (.NET 10)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./backend
      
      - name: Build solution
        run: dotnet build Clinic.slnx --no-restore --configuration Release
        working-directory: ./backend
      
      - name: Run tests
        run: dotnet test Clinic.slnx --no-build --configuration Release --verbosity normal
        working-directory: ./backend
      
      - name: Run tests with coverage
        run: |
          dotnet test Clinic.slnx \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
        working-directory: ./backend
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/TestResults/**/coverage.cobertura.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies (reproducible, lockfile-driven)
        run: npm ci
        working-directory: ./frontend
      
      - name: Run frontend tests
        run: npm run test
        working-directory: ./frontend
